# Capture the remote desktop mix without host ALSA devices or audio sockets.
context.objects = [
    { factory = adapter
      args = {
          factory.name = support.null-audio-sink
          node.name = wrdp-audio-sink
          node.description = "WRDP Remote Audio"
          media.class = "Audio/Sink"
          node.virtual = true
          audio.position = [ FL FR ]
          monitor.channel-volumes = true
      }
    }
]
